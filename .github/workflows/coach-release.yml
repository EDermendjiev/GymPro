# SPDX-License-Identifier: GPL-3.0-only
name: GymPro release

# Builds the GymPro APKs and publishes them as a GitHub release when a tag
# named gympro-v* is pushed (for example gympro-v1.0.0), or when started by
# hand with a tag name. Upstream's build-apk.yml is left untouched so that
# upstream merges stay conflict-free.
#
# Signing: when the repository has the secrets KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_PASSWORD and KEY_ALIAS, the APKs are signed with that
# release key and the release is a normal one. Without them the APKs carry a
# throwaway debug signature and the release is marked as a pre-release: such
# APKs install, but a later build with a different key cannot update them.
on:
  push:
    tags: ['gympro-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. gympro-v1.0.0 (created if missing)'
        required: true
        type: string

permissions:
  contents: write

# Pinned Flutter version. Keep it equal to FLUTTER_VERSION in build-apk.yml.
env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Coach packages
        run: |
          for p in coach_testkit coach_kernel coach_progression coach_training coach_recovery coach_nutrition coach_planner; do
            (cd "packages/$p" && dart pub get && dart analyze --fatal-warnings && dart test) || exit 1
          done

      - name: Set up signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/gympro-release.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=gympro-release.jks
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release key in the repository secrets: the APKs get a debug signature."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     GymPro-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   GymPro-armeabi-v7a.apk
          mv app-x86_64-release.apk        GymPro-x86_64.apk

      - name: Release notes
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          {
            echo "GymPro: a gym log with a built-in coach. Based on GymMane by InlitX."
            echo
            echo "Most phones need GymPro-arm64-v8a.apk. GymPro installs beside GymMane under its own id, io.github.edermendjiev.gympro."
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "This is a pre-release with a debug signature. It installs, but it cannot be updated by a later build that is signed with a release key; uninstall it first in that case."
            fi
          } > build/release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: GymPro ${{ inputs.tag || github.ref_name }}
          body_path: build/release-notes.md
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
          files: |
            build/app/outputs/flutter-apk/GymPro-arm64-v8a.apk
            build/app/outputs/flutter-apk/GymPro-armeabi-v7a.apk
            build/app/outputs/flutter-apk/GymPro-x86_64.apk
